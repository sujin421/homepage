<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 점검 및 서비스 이용 안내 - 인천교통공사</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .logo-area {
            font-size: 1.1rem;
            font-weight: 700;
            color: #004098;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        h1 {
            font-size: 1.6rem;
            color: #222;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .desc {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .phone-box {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .phone-label {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .phone-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #004098;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .phone-number:hover {
            text-decoration: underline;
        }
        .footer-info {
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">인천교통공사 INCHEON TRANSIT CORPORATION</div>
        
        <h1>홈페이지 일시 서비스 중단 안내</h1>
        
        <p class="desc">
            현재 홈페이지 시스템 점검 또는 일시적인 장애로 인해 서비스 접속이 원활하지 않습니다.<br>
            이용에 불편을 드려 진심으로 사과드리며, 긴급 문의 사항은 아래 대표전화로 연락해 주시기 바랍니다.
        </p>
        
        <div class="phone-box">
            <div class="phone-label">인천교통공사 고객센터 / 대표전화</div>
            <!-- 모바일 기기에서 터치 시 바로 통화 연결되도록 tel: 링크 적용 -->
            <a href="tel:1899-4446" class="phone-number">1899-4446</a>
        </div>
        
        <div class="footer-info">
            빠른 시간 내에 정상적인 서비스가 가능하도록 조치하겠습니다.
        </div>
    </div>

</body>
</html>
